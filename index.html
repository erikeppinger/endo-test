<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- No network: the page may only load its own files and may not connect anywhere. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <!-- Test phase: keep search engines out. Remove this line in all three pages at launch. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="FightEndo – Endometriose-Beschwerden dokumentieren und einen belegten Brief an die Krankenkasse schreiben. Läuft komplett offline.">
  <meta name="theme-color" content="#f5c518">
  <title>FightEndo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#view">Zum Inhalt</a>
  <header class="top">
    <a class="brand" href="#start" aria-label="FightEndo Start">
      <img src="icons/icon.svg" alt="" width="36" height="36">
      <span><strong>Fight</strong>Endo</span>
    </a>
    <div id="lang" class="lang"></div>
    <a id="helplink" class="helplink" href="#help"></a>
    <p id="tagline" class="tagline"></p>
    <nav id="nav" aria-label="Hauptnavigation"></nav>
  </header>

  <main id="view" tabindex="-1"></main>
  <nav id="bottomnav" class="bottomnav" aria-label="Navigation"></nav>

  <footer id="footer" class="foot"></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <pre id="print-area" class="print-area"></pre>

  <script src="js/core.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/native.js"></script>
  <script src="js/signature.js"></script>
  <!-- BEGIN:modules – generated by `npm run sync` from i18n/ and jurisdictions/, do not edit by hand -->
  <script src="i18n/de.js"></script>
  <script src="i18n/en.js"></script>
  <script src="jurisdictions/de/index.js"></script>
  <!-- END:modules -->
  <script src="js/app.js"></script>
</body>
</html>
