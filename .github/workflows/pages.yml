# Publishes the web app (installable PWA) and the privacy policy on GitHub Pages:
#   https://<user>.github.io/fightendo/            – the app
#   https://<user>.github.io/fightendo/privacy.html – privacy policy URL for the app stores
# Enable once: Settings → Pages → Source: GitHub Actions.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: node tools/build-web.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
